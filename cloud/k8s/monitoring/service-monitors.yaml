apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ilews-fastapi
  namespace: ilews-production
  labels:
    app: fastapi-backend
spec:
  selector:
    matchLabels:
      app: fastapi-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
