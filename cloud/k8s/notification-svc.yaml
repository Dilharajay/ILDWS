apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: ilews-production
  labels:
    app: notification-svc
    app.kubernetes.io/part-of: ilews
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-svc
  template:
    metadata:
      labels:
        app: notification-svc
    spec:
      containers:
        - name: notification-svc
          image: gcr.io/ILEWS_PROJECT/notification-svc:latest
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: ilews-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-svc
  namespace: ilews-production
  labels:
    app: notification-svc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8002
      protocol: TCP
  selector:
    app: notification-svc
