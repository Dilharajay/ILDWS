apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-etl
  namespace: ilews-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: etl-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
