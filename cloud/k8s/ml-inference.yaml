apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference
  namespace: ilews-production
  labels:
    app: ml-inference
    app.kubernetes.io/part-of: ilews
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
    spec:
      containers:
        - name: ml-inference
          image: gcr.io/ILEWS_PROJECT/ml-inference:latest
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef:
                name: ilews-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference
  namespace: ilews-production
  labels:
    app: ml-inference
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8003
      protocol: TCP
  selector:
    app: ml-inference
