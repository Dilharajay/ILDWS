apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  namespace: ilews-production
  labels:
    app: fastapi-backend
    app.kubernetes.io/part-of: ilews
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      serviceAccountName: ilews-backend-sa
      containers:
        - name: fastapi-backend
          image: gcr.io/ILEWS_PROJECT/fastapi-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ilews-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-backend
  namespace: ilews-production
  labels:
    app: fastapi-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: fastapi-backend
