# ILEWS – Docker Compose for local development
version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ilews-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ilews
      POSTGRES_USER: ilews_dev
      POSTGRES_PASSWORD: ilews_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilews_dev -d ilews"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ilews-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ilews-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
      - mosquittolog:/mosquitto/log

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: ilews-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts

volumes:
  pgdata:
  redisdata:
  mosquittodata:
  mosquittolog:
